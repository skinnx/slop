<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>game harness</title>
  <!-- Same viewport meta as the official web-mobile template. Without it, mobile emulation lays out at 980px and touch maps wrong. -->
  <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=1">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #GameDiv, #Cocos3dGameContainer { width: 100%; height: 100%; }
  </style>
  <script type="importmap">{ "imports": { "cc": "/engine/cc.js" } }</script>
</head>
<body>
  <div id="GameDiv"><div id="Cocos3dGameContainer"><canvas id="GameCanvas" tabindex="99"></canvas></div></div>
  <script type="module" src="/bundle/main.js"></script>
</body>
</html>
